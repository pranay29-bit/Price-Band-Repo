name: Run Pine Seeds Band Update

# Manually triggered from the GitHub Actions tab ("Run workflow" button).
#
# How to use:
#   1. Commit your day's raw file into incoming/ first, e.g.:
#        incoming/sec_list_03082026.csv
#      (git add incoming/sec_list_03082026.csv && git commit -m "raw file" && git push)
#   2. Go to the Actions tab on GitHub -> "Run Pine Seeds Band Update" -> "Run workflow"
#   3. Enter the filename (e.g. sec_list_03082026.csv) in the input box and run.
#   4. The workflow runs the converter and commits the updated data/BAND/*.csv
#      files back to the repo automatically - no local git commands needed.

on:
  workflow_dispatch:
    inputs:
      csv_filename:
        description: "Filename inside incoming/ to process (e.g. sec_list_03082026.csv)"
        required: true
        type: string
      override_date:
        description: "Optional: override date as YYYY-MM-DD (leave blank to auto-parse from filename)"
        required: false
        type: string
        default: ""

jobs:
  update-band-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify input file exists
        run: |
          FILE="incoming/${{ inputs.csv_filename }}"
          if [ ! -f "$FILE" ]; then
            echo "::error::File not found: $FILE. Commit it into incoming/ first, then re-run this workflow."
            exit 1
          fi
          echo "Found $FILE"

      - name: Run converter
        run: |
          if [ -n "${{ inputs.override_date }}" ]; then
            python scripts/nse_band_to_pine_seeds.py "incoming/${{ inputs.csv_filename }}" --date "${{ inputs.override_date }}"
          else
            python scripts/nse_band_to_pine_seeds.py "incoming/${{ inputs.csv_filename }}"
          fi

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/BAND
          if git diff --cached --quiet; then
            echo "No changes to commit (data already up to date)."
          else
            git commit -m "Band update from ${{ inputs.csv_filename }}"
            git push
          fi

      - name: Summary
        run: |
          echo "### Pine Seeds Band Update" >> $GITHUB_STEP_SUMMARY
          echo "- Input file: \`${{ inputs.csv_filename }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Date used: \`${{ inputs.override_date || 'auto-parsed from filename' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Files updated: \`data/BAND/*.csv\`" >> $GITHUB_STEP_SUMMARY
